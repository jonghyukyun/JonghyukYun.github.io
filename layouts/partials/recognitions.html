{{ $awardImg := .award_image }}{{ with .recognitions }}<div class="recognition-badges" aria-label="Awards and recognition">{{ range . }}<span class="recognition-item"><span class="recognition-badge{{ if and $awardImg (strings.Contains . "Award") }} award-preview-trigger" data-award-img="{{ $awardImg | relURL }}" title="Hover to view award certificate{{ end }}"><span aria-hidden="true">🏆</span> <strong>{{ replace . " (accompanying poster)" "" | upper }}</strong>{{ if and $awardImg (strings.Contains . "Award") }} <span class="badge-photo-hint">📷</span>{{ end }}</span>{{ if strings.Contains . "accompanying poster" }} <span class="award-explanation">(*Poster accompanied full paper)</span>{{ end }}</span>{{ end }}</div>{{ end }}
